name: ALYCON pinned open-weight causal gate

on:
  push:
    branches:
      - research/openweights-pretrained-20261123
    paths:
      - 'research/openweights_20261123/**'
      - '.github/workflows/alycon-openweights-20261123.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretrained-native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@v4
      - name: Prepare Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned model runtime (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'transformers==4.46.3' 'huggingface_hub==0.26.5' 'safetensors==0.4.5'
          python -c "import torch, transformers, huggingface_hub;print('runtime', torch.__version__, transformers.__version__, huggingface_hub.__version__)"
      - name: Predict — official GPT-2 weights, clean and singleton interventions only
        run: |
          python research/openweights_20261123/hosted_smoke.py predict \
            --model-dir weights/gpt2 --out results/gpt2 --download
      - name: Record independent freeze hash
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path('results/gpt2/freeze.json')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          q=json.loads(p.read_text())
          assert q['prediction_sha256']==hashlib.sha256(pathlib.Path('results/gpt2/pred.npz').read_bytes()).hexdigest()
          with open('freeze.sha256','w') as f:f.write(h+'  results/gpt2/freeze.json\n')
          with open(pathlib.Path('.').joinpath('freeze.env'),'w') as f:f.write('ALYCON_FREEZE_SHA='+h+'\n')
          print('FROZEN PREDICTION HASH',h)
          PY
          cat freeze.env >> "$GITHUB_ENV"
      - name: Reveal — only now execute joint head ablations
        run: |
          python research/openweights_20261123/hosted_smoke.py reveal \
            --model-dir weights/gpt2 --out results/gpt2 \
            --freeze-sha "$ALYCON_FREEZE_SHA"
      - name: Preserve model provenance and positive/negative outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alycon-pretrained-native-003
          path: |
            results/gpt2/
            freeze.sha256
          if-no-files-found: warn
          retention-days: 30
